title: Ultimate Cheatsheet for Developers
description: Curated list of useful resources and cheatsheets for web developers
theme: jekyll-theme-minimal
baseurl: "/ultimate-cheatsheet-for-developers"
url: "https://zlatanstajic.github.io"

markdown: kramdown

# Exclude directories and/or files from the conversion
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - .remarkrc.js
  - .cspell.json
  - .mlc-config.json
  - CONTRIBUTING.md
  - LICENSE.md
  - assets/cli-index.json
  - bin
  - scripts

# Include specific files
include:
  - README.md

# Apply the theme's `default` layout to all rendered pages (H-10). The content
# pages carry `last_reviewed`/`tested_on` frontmatter but no `layout:` key;
# without an explicit default a page can render without the jekyll-theme-minimal
# chrome. This `defaults` block guarantees every Markdown page (root README plus
# everything under shell/ and knowledgebase/) is wrapped in the theme layout.
defaults:
  - scope:
      path: ""
    values:
      layout: default
