name: Build search index

on:
  push:
    branches: [master]
    paths:
      - "knowledgebase/**"
      - "shell/**"
      - "README.md"
      - "scripts/build-search-index.mjs"

permissions:
  contents: write

# Shared with check-freshness.yml and build-leaderboard.yml: all three bots push
# to master, so they share one concurrency group to serialize their rebase/push
# (cancel-in-progress: false → queue rather than cancel) and avoid racing (H-15).
concurrency:
  group: auto-commit-master
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:index
      - name: Commit updated index
        run: |
          git diff --quiet -- assets/search-index.json || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/search-index.json
            git commit -m "chore: rebuild search index [skip ci]"
            git pull --rebase origin master
            git push
          )
